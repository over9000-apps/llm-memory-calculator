# Deploys llm-memory-calculator to Cloudflare (overflow account over9000-pool-000), then checks https://llm-memory-calculator.over9000.cc.
# Needs secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (repo-level). Pushing to main deploys production.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-llm-memory-calculator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, gb]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret is missing; refusing to skip deploy silently."; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
      - name: Build + deploy
        run: pnpm run build && npx -y wrangler@4 deploy
      - name: Smoke https://llm-memory-calculator.over9000.cc
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/body-llm-memory-calculator -w '%{http_code}' "https://llm-memory-calculator.over9000.cc/")
            if [ "$code" = 200 ] && grep -q G-FG52JBJRPS /tmp/body-llm-memory-calculator; then exit 0; fi
            sleep 10
          done
          echo "::error::door check failed (HTTP $code or GA tag missing)"; exit 1
